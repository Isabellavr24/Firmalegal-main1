name: Deploy a Producción

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  verificar:
    name: Verificaciones previas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Validar sintaxis de backend
        run: |
          fallos=0
          while IFS= read -r archivo; do
            if ! node --check "$archivo" 2>/tmp/err; then
              echo "::error file=$archivo::$(head -3 /tmp/err | tr '\n' ' ')"
              fallos=$((fallos + 1))
            fi
          done < <(find backend -name '*.js' -not -path '*/node_modules/*')
          echo "Archivos con error de sintaxis: $fallos"
          test "$fallos" -eq 0

      - name: Detectar marcadores de trabajo sin terminar
        run: |
          if grep -rn 'NO-SUBIR-A-PROD' --include='*.js' --include='*.html' backend frontend; then
            echo "::error::Hay código marcado como no apto para producción"
            exit 1
          fi

  desplegar:
    name: Desplegar
    needs: verificar
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Levantar VPN
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools
          # El paso por el secret puede perder los espacios alrededor de '=',
          # formato que wg-quick rechaza. Se normaliza antes de escribir.
          printf '%s\n' "${{ secrets.PROD_WG_CONFIG }}" \
            | sed -E 's/^([A-Za-z]+)[[:space:]]*=[[:space:]]*/\1 = /' \
            | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          # wg-quick retorna antes de que el túnel esté operativo.
          for i in $(seq 1 15); do
            ping -c1 -W2 ${{ secrets.PROD_HOST }} >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::error::La VPN no estableció conexión con el servidor"
          exit 1

      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Desplegar con rollback automático
        run: |
          ssh -i ~/.ssh/id_ed25519 firmalegal@${{ secrets.PROD_HOST }} \
            "sudo /usr/local/bin/fl-deploy.sh ${{ github.sha }}"

      - name: Cerrar VPN
        if: always()
        run: sudo wg-quick down wg0 || true
