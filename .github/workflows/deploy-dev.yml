name: Deploy a Desarrollo

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificaciones previas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Validar sintaxis de backend
        run: find backend -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check

  desplegar:
    name: Desplegar
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - name: Configurar WireGuard
        run: |
          sudo apt-get update && sudo apt-get install -y wireguard-tools
          echo "${{ secrets.DEV_WG_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.DEV_SSH_PORT }} -H ${{ secrets.DEV_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Desplegar con rollback automático
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.DEV_SSH_PORT }} firmalegal@${{ secrets.DEV_HOST }} \
            'sudo /usr/local/bin/fl-deploy.sh ${{ github.sha }}'

      - name: Cerrar VPN
        if: always()
        run: sudo wg-quick down wg0 || true
