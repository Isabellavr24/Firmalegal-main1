version: '3.8'

services:
  # ==========================================
  # MySQL Database
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: firmalegal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: firmalegalonline
      MYSQL_USER: firmalegal_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database-dump.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    networks:
      - firmalegal-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ==========================================
  # Redis (para colas de email)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: firmalegal-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - firmalegal-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Aplicación FirmaLegal
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: firmalegal-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_USER=firmalegal_user
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=firmalegalonline
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_URL=${APP_URL}
      - CERT_PASSWORD=${CERT_PASSWORD}
      - TSA_URL=${TSA_URL}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./uploads:/app/uploads
      - ./backend/certificates:/app/backend/certificates:ro
      - app_logs:/app/logs
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - firmalegal-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================
  # Domain Monitor (SSL/Domain expiry dashboard)
  # ==========================================
  domain-monitor:
    build:
      context: /root/domain-monitor
      dockerfile: Dockerfile
    container_name: domain-monitor
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - firmalegal-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ==========================================
  # Nginx Reverse Proxy (Opcional para HTTPS)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: firmalegal-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/letsencrypt/live/firmalegalonline.com:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - app
      - domain-monitor
    networks:
      - firmalegal-network

# ==========================================
# Volúmenes persistentes
# ==========================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  app_logs:
    driver: local
  nginx_cache:
    driver: local

# ==========================================
# Red interna
# ==========================================
networks:
  firmalegal-network:
    driver: bridge
