# ==========================================
# NGINX CONFIGURATION FOR FIRMALEGAL
# Reverse proxy con soporte HTTPS
# ==========================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # El navegador recuerda durante un año que este dominio es solo HTTPS, asi
    # que ni siquiera intenta la primera conexion en claro. Sin preload: eso se
    # registra en una lista de la que cuesta salir.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Al salir del sitio no se filtra la ruta completa, que en los enlaces de
    # firma lleva el token del firmante.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # NO poner Permissions-Policy con camera=(): la validacion biometrica corre
    # en ESTE dominio (/validacion/), no en otro. Puesta el 21-09-2026, bloqueo
    # la camara a todos los padres en todos los navegadores —el navegador decia
    # "permiso concedido" y aun asi fallaba con NotAllowedError— y se revirtio
    # el mismo dia. Si algun dia se quiere, tiene que permitir el propio origen:
    # camera=(self).
    # No anunciar la version exacta de nginx en cada respuesta.
    server_tokens off;

    # Content-Security-Policy queda pendiente a proposito: mal ajustada rompe
    # el visor de PDF y la firma. Conviene probarla primero en desarrollo con
    # Content-Security-Policy-Report-Only.

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/s;

    # Upstream (Node.js app)
    upstream firmalegal_app {
        server firmalegal-app:3000;
        keepalive 32;
    }

    # Upstream (Domain Monitor - PHP)
    upstream domain_monitor {
        server domain-monitor:80;
    }

    # Upstream (Validacion de Identidad)
    upstream validacion_identidad {
        server validacion-identidad-app-1:3000;
        keepalive 32;
    }

    # HTTP Server (redirect to HTTPS)
    server {
        listen 80;
        server_name firmalegalonline.com www.firmalegalonline.com pki.firmalegalonline.com;

        # Redirigir todo a HTTPS
        return 301 https://$host$request_uri;
    }

    # HTTPS Server
    server {
        listen 443 ssl http2;
        server_name firmalegalonline.com www.firmalegalonline.com pki.firmalegalonline.com;

        # SSL certificates (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/firmalegalonline.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/firmalegalonline.com/privkey.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Client max body size (para uploads de PDFs)
        client_max_body_size 50M;

        # Health check endpoint
        location /health {
            proxy_pass http://firmalegal_app;
            access_log off;
        }

        # API endpoints con rate limiting
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://firmalegal_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;

            # Headers para cookies con HTTPS
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / /;

            # Timeouts para operaciones largas
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Upload endpoints con rate limiting específico
        location /api/documents/upload {
            limit_req zone=upload_limit burst=5 nodelay;
            client_max_body_size 50M;

            proxy_pass http://firmalegal_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Headers para cookies con HTTPS
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / /;

            # Timeouts extendidos para uploads grandes
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # Static files con cache
        location /public/ {
            proxy_pass http://firmalegal_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            # Cache estático
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ==========================================
        # Domain Monitor — assets estáticos (CSS/JS locales, sin sub_filter)
        location /monitor/assets/ {
            proxy_pass http://domain_monitor/assets/;
            proxy_set_header Host $host;
            proxy_set_header Accept-Encoding "";
            proxy_hide_header X-Powered-By;
        }

        # Domain Monitor Dashboard (/monitor/)
        # ==========================================
        location /monitor/ {
            proxy_pass http://domain_monitor/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / /monitor/;

            # CRITICAL: Disable upstream gzip so sub_filter can work on plain text
            # Nginx will re-compress with its own gzip after sub_filter rewrites
            proxy_set_header Accept-Encoding "";

            # PHP generates Location headers with /monitor prefix via BASE_PATH
            proxy_redirect default;

            # Rewrite HTML content: href/action/fetch/JS URLs in templates
            sub_filter_once off;
            sub_filter_types text/html text/css application/javascript;
            sub_filter 'href="/' 'href="/monitor/';
            sub_filter 'action="/' 'action="/monitor/';
            sub_filter "fetch('/" "fetch('/monitor/";
            sub_filter 'fetch("/' 'fetch("/monitor/';
            sub_filter "window.location.href = '/" "window.location.href = '/monitor/";
            sub_filter "window.location.href='/" "window.location.href='/monitor/";
            sub_filter 'window.location.href="/' 'window.location.href="/monitor/';
            sub_filter "window.location = '/" "window.location = '/monitor/";
            sub_filter 'src="/assets/' 'src="/monitor/assets/';
        }
        location = /monitor {
            return 301 /monitor/;
        }

        # ==========================================
        # Validacion de Identidad (/validacion/)
        # ==========================================
        location /validacion/ {
            proxy_pass http://validacion_identidad/validacion/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;

            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / /;

            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            client_max_body_size 50M;
        }
        location = /validacion {
            return 301 /validacion/;
        }

        # Resto de rutas
        location / {
            proxy_pass http://firmalegal_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;

            # Headers para cookies con HTTPS
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / /;
        }
    }

    # pkicertifica.com — Firmador Certificado
    server {
        listen 80;
        server_name pkicertifica.com www.pkicertifica.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name pkicertifica.com www.pkicertifica.com;

        ssl_certificate /etc/letsencrypt/live/pkicertifica.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pkicertifica.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 50M;

        location /api/ {
            proxy_pass http://pki-correo-backend:3002/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
            client_max_body_size 50M;
        }

        location / {
            proxy_pass http://pki-correo-backend:3002/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
        }
    }
}
