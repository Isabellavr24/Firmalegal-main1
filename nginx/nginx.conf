# ==========================================
# NGINX CONFIGURATION FOR FIRMALEGAL
# Reverse proxy con soporte HTTPS
# ==========================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/s;

    # Upstream (Node.js app)
    upstream firmalegal_app {
        server firmalegal-app:3000;
        keepalive 32;
    }

    # Upstream (Domain Monitor - PHP)
    upstream domain_monitor {
        server domain-monitor:80;
    }

    # HTTP Server (redirect to HTTPS)
    server {
        listen 80;
        server_name firmalegalonline.com www.firmalegalonline.com pki.firmalegalonline.com;

        # Redirigir todo a HTTPS
        return 301 https://$host$request_uri;
    }

    # HTTPS Server
    server {
        listen 443 ssl http2;
        server_name firmalegalonline.com www.firmalegalonline.com pki.firmalegalonline.com;

        # SSL certificates (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/firmalegalonline.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/firmalegalonline.com/privkey.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Client max body size (para uploads de PDFs)
        client_max_body_size 50M;

        # Health check endpoint
        location /health {
            proxy_pass http://firmalegal_app;
            access_log off;
        }

        # API endpoints con rate limiting
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://firmalegal_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;

            # Headers para cookies con HTTPS
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / /;

            # Timeouts para operaciones largas
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Upload endpoints con rate limiting específico
        location /api/documents/upload {
            limit_req zone=upload_limit burst=5 nodelay;
            client_max_body_size 50M;

            proxy_pass http://firmalegal_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Headers para cookies con HTTPS
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / /;

            # Timeouts extendidos para uploads grandes
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # Static files con cache
        location /public/ {
            proxy_pass http://firmalegal_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            # Cache estático
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ==========================================
        # Domain Monitor Dashboard (/monitor/)
        # ==========================================
        location /monitor/ {
            proxy_pass http://domain_monitor/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / /monitor/;

            # CRITICAL: Disable upstream gzip so sub_filter can work on plain text
            # Nginx will re-compress with its own gzip after sub_filter rewrites
            proxy_set_header Accept-Encoding "";

            # PHP generates Location headers with /monitor prefix via BASE_PATH
            proxy_redirect default;

            # Rewrite HTML content: href/action/fetch/JS URLs in templates
            sub_filter_once off;
            sub_filter_types text/html text/css application/javascript;
            sub_filter 'href="/' 'href="/monitor/';
            sub_filter 'action="/' 'action="/monitor/';
            sub_filter "fetch('/" "fetch('/monitor/";
            sub_filter 'fetch("/' 'fetch("/monitor/';
            sub_filter "window.location.href = '/" "window.location.href = '/monitor/";
            sub_filter "window.location.href='/" "window.location.href='/monitor/";
            sub_filter 'window.location.href="/' 'window.location.href="/monitor/';
            sub_filter "window.location = '/" "window.location = '/monitor/";
            sub_filter 'src="/assets/' 'src="/monitor/assets/';
        }
        location = /monitor {
            return 301 /monitor/;
        }

        # Resto de rutas
        location / {
            proxy_pass http://firmalegal_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;

            # Headers para cookies con HTTPS
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / /;
        }
    }
}
